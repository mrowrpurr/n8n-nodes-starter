<svg viewBox="0 0 220 200" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF00FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00CFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6A00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Code block outline -->
  <rect x="10" y="10" width="200" height="180" rx="15" fill="none" stroke="url(#grad)" stroke-width="4"/>

  <!-- Opening brace (shifted up) -->
  <text x="20" y="65" font-size="36" fill="url(#grad)">{</text>

  <!-- Variables (shifted up) -->
  <text x="60" y="100" font-size="36" font-weight="bold" fill="url(#grad2)">$foo</text>
  <text x="60" y="145" font-size="36" font-weight="bold" fill="url(#grad)">$bar</text>

  <!-- Closing brace (shifted up) -->
  <text x="20" y="160" font-size="36" fill="url(#grad)">}</text>
</svg>
